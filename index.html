<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Sijil AI</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca; --secondary: #10b981; --secondary-hover: #059669;
            --warning: #f59e0b; --warning-hover: #d97706; --danger: #ef4444; --danger-hover: #dc2626;
            --bg-color: #f3f4f6; --surface: #ffffff; --text-main: #1f2937; --text-light: #6b7280;
            --border: #e5e7eb; --radius: 12px; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; overscroll-behavior: none; }
        
        .screen { display: none; width: 100%; max-width: 1200px; padding: 20px; animation: fadeIn 0.3s ease; }
        .active-screen { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 25px; }
        input, select { width: 100%; padding: 12px 16px; margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; transition: border 0.3s; background: #fff;}
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; padding: 12px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: white; width: 100%; }
        button:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-primary { background: var(--primary); } .btn-success { background: var(--secondary); }
        .btn-warning { background: var(--warning); color: #fff; } .btn-danger { background: var(--danger); }
        .btn-ghost { background: transparent; color: var(--primary); box-shadow: none; } .btn-ghost:hover { background: rgba(79, 70, 229, 0.05); }

        #loginScreen .card { max-width: 400px; margin: 10vh auto; text-align: center; }
        .dashboard-container { display: grid; grid-template-columns: 350px 1fr; gap: 20px; align-items: start; }
        @media (max-width: 768px) { .dashboard-container { grid-template-columns: 1fr; } }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 15px 25px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
        .sidebar, .main-panel { background: var(--surface); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
        
        .student-list { list-style: none; max-height: 60vh; overflow-y: auto; margin-top: 15px; }
        .student-item { padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; display: flex; align-items: center; gap: 12px; }
        .student-item img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #e5e7eb; border: 1px solid #d1d5db;}
        .student-item.active { background: rgba(79, 70, 229, 0.1); border-color: var(--primary); font-weight: 600; color: var(--primary); }
        
        .student-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap:15px;}
        .student-profile-info { display: flex; gap: 15px; align-items: center; }
        .student-profile-info img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .student-profile-info h2 { margin:0; font-size: 20px;}
        .student-profile-info p { margin:2px 0 0 0; font-size: 12px; color: var(--text-light); }
        
        .cert-list { display: flex; flex-direction: column; gap: 20px; }
        .cert-card { background: var(--surface); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 15px; transition: border 0.3s; }
        .cert-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; flex-wrap: wrap; gap: 10px;}
        .cert-header h4 { font-size: 16px; margin-bottom: 5px; color: var(--primary); }
        
        .cert-thumbnails { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; align-items: stretch; }
        .thumb-item { position: relative; min-width: 150px; max-width: 150px; border: 2px solid var(--border); border-radius: var(--radius); overflow: hidden; background: #fff; box-shadow: var(--shadow); flex-shrink: 0; cursor: grab; transition: all 0.2s; display:flex; flex-direction:column;}
        .thumb-item:active { cursor: grabbing; }
        .thumb-item.dragging { opacity: 0.5; transform: scale(0.95); border: 2px dashed var(--primary); }
        .thumb-item.drag-over { border-left: 4px solid var(--primary); transform: translateX(5px); }
        .thumb-item img { width: 100%; height: 180px; object-fit: cover; display: block; border-bottom: 1px solid var(--border); cursor: pointer; }
        .thumb-item img:hover { filter: brightness(0.8); }
        .img-overlay-text { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; text-shadow: 1px 1px 3px black; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
        .thumb-item:hover .img-overlay-text { opacity: 1; }
        
        .thumb-actions { display: flex; flex-direction: column; }
        .thumb-actions button { border-radius: 0; padding: 10px 0; font-size: 12px; }
        .thumb-add-btn { min-width: 150px; max-width: 150px; border: 2px dashed var(--primary); border-radius: var(--radius); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; color: var(--primary); font-weight: bold; background: rgba(79, 70, 229, 0.05); }

        #scannerScreen { text-align: center; }
        #scannerScreen .card { max-width: 800px; margin: auto; }
        video, canvas { width: 100%; max-height: 45vh; border-radius: 8px; background: #000; object-fit: contain; margin-bottom: 15px; }
        canvas { display: none; }
        .btn-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;}
        .btn-group button { width: auto; min-width: 140px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; animation: fadeIn 0.2s ease; }
        .modal-box { background: var(--surface); padding: 25px; border-radius: 20px; width: 95%; max-width: 500px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.9); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; max-height: 95vh; display: flex; flex-direction: column; }
        @keyframes popIn { to { transform: scale(1); } }
        .hidden { display: none !important; }

        #editorModalBox { max-width: 950px; width: 98%; height: 96vh; padding: 15px; }
        .editor-toolbar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
        .editor-toolbar button { flex: 0 0 auto; width: auto; padding: 8px 15px; font-size: 13px; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); }
        .editor-toolbar button.active-tool { background: var(--primary); color: white; border-color: var(--primary); }
        .editor-canvas-container { flex: 1; overflow: auto; background: #e5e7eb; border-radius: 8px; border: 1px solid #ccc; position: relative; touch-action: none; display:flex; justify-content: center; align-items: center;}
        #editorCanvas { max-width: 100%; object-fit: contain; cursor: crosshair; touch-action: none; background: #fff;}
        .editor-footer { display: flex; justify-content: space-between; margin-top: 15px; gap: 10px; }
        
        .tool-options { display: none; background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px dashed var(--primary); font-size: 13px; text-align: left;}
        
        /* CSS BARU UNTUK THUMBNAIL CLOUD */
        .cloud-certs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .cloud-cert-card { background: #fff; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; cursor: pointer;}
        .cloud-cert-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .cloud-cert-card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid var(--border); background: #f3f4f6;}
        .cloud-cert-info { padding: 10px; flex: 1; display:flex; flex-direction:column; justify-content:space-between;}
        .cloud-cert-name { font-weight: 600; font-size: 13px; color: var(--text-main); margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;}
        .cloud-cert-date { font-size: 11px; color: var(--text-light); }
        
    </style>
</head>
<body>

    <div id="globalLoading" class="modal-overlay" style="z-index: 10000; flex-direction: column;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 60px; color: var(--primary); margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.2);"></i>
        <div id="loadingText" style="color: white; font-size: 18px; font-weight: bold; text-align: center; padding: 0 20px;">Sila tunggu sebentar...</div>
    </div>

    <div id="customAlert" class="modal-overlay" style="z-index: 10001;">
        <div class="modal-box" style="max-width: 400px; max-height: 90vh;">
            <i id="alertIcon" class="fa-solid fa-circle-info" style="font-size: 50px; margin-bottom: 15px;"></i>
            <div id="alertTitle" style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">Tajuk</div>
            <div id="alertMessage" style="font-size: 14px; color: var(--text-light); margin-bottom: 20px;">Mesej...</div>
            <button id="alertBtn" class="btn-primary" style="width: 100%; border-radius: 50px;" onclick="closeAppAlert()">Tutup</button>
        </div>
    </div>

    <div id="addStudentModal" class="modal-overlay">
        <div class="modal-box" style="max-height: 90vh;">
            <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-user-plus"></i> Pendaftaran Pelajar</h3>
            <input type="text" id="regName" placeholder="Nama Penuh (Wajib Diisi)">
            <input type="text" id="regKelas" placeholder="Kelas (Tidak Wajib)">
            <input type="text" id="regIc" placeholder="No. Kad Pengenalan (Tidak Wajib)">
            <select id="regJantina"><option value="">Pilih Jantina...</option><option value="Lelaki">Lelaki</option><option value="Perempuan">Perempuan</option></select>
            <input type="text" id="regKategori" placeholder="Kategori cth: Asnaf/B40 (Tidak Wajib)">
            <div style="text-align:left; margin-top:10px;">
                <label style="font-size:12px; font-weight:bold; color:var(--text-light);">Gambar Profil (Tidak Wajib):</label>
                <input type="file" id="regGambar" accept="image/*" style="border:none; padding-left:0;">
            </div>
            <div class="btn-group" style="margin-top:15px;">
                <button class="btn-primary" id="btnSubmitStudent" onclick="submitStudent()"><i class="fa-solid fa-save"></i> Simpan Rekod</button>
                <button class="btn-ghost" onclick="document.getElementById('addStudentModal').style.display='none'">Batal</button>
            </div>
        </div>
    </div>

    <div id="powerEditorModal" class="modal-overlay">
        <div class="modal-box" id="editorModalBox">
            <h3 style="margin-bottom: 10px; text-align: left; font-size: 18px;"><i class="fa-solid fa-pen-ruler"></i> Editor Power</h3>
            
            <div class="editor-toolbar">
                <button id="toolErase" onclick="setTool('erase')"><i class="fa-solid fa-eraser"></i> Padam (Whiteout)</button>
                <button id="toolText" onclick="setTool('text')"><i class="fa-solid fa-font"></i> Tulis Teks</button>
                <button id="toolCrop" onclick="setTool('crop')"><i class="fa-solid fa-crop-simple"></i> Crop</button>
                <button onclick="applyAiFilter()"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Filter</button>
                <button onclick="undoEditor()"><i class="fa-solid fa-rotate-left"></i> Undo</button>
            </div>

            <div id="textOptions" class="tool-options">
                <label>Saiz: </label><input type="number" id="txtSize" value="30" style="width: 60px; padding: 5px; display: inline;"> px | 
                <label>Warna: </label><input type="color" id="txtColor" value="#000000" style="width: 40px; padding: 0; display: inline; border: none;">
                <br><i>Klik di atas gambar untuk taip teks.</i>
            </div>
            
            <div id="cropOptions" class="tool-options">
                <i>Tarik kotak merah, kemudian klik:</i>
                <button class="btn-warning" onclick="executeCrop()" style="width: auto; padding: 5px 15px; margin-left: 10px;">Crop Sekarang</button>
            </div>

            <div class="editor-canvas-container" id="canvasContainer"><canvas id="editorCanvas"></canvas></div>

            <div class="editor-footer">
                <button class="btn-danger" onclick="closeEditor()"><i class="fa-solid fa-xmark"></i> Batal</button>
                <button class="btn-success" onclick="saveEditor()"><i class="fa-solid fa-check"></i> Simpan</button>
            </div>
        </div>
    </div>

    <div id="loginScreen" class="screen">
        <div class="card">
            <i class="fa-solid fa-expand" style="font-size: 40px; color: var(--primary); margin-bottom: 10px;"></i>
            <h3>Sistem Sijil Pro</h3>
            <p style="color: var(--text-light); margin-bottom: 20px; font-size: 14px;">Log masuk untuk mengurus rekod</p>
            <input type="email" id="loginEmail" placeholder="Email Guru (Cth: guru@edu.my)">
            <input type="password" id="loginPassword" placeholder="Kata Laluan">
            <button class="btn-primary" onclick="login()" style="margin-top: 15px;">Log Masuk</button>
            <button class="btn-ghost" onclick="register()">Daftar Akaun Baru</button>
        </div>
    </div>

    <div id="dashboardScreen" class="screen">
        <div class="top-bar">
            <h2><i class="fa-solid fa-graduation-cap"></i> Portal Guru
