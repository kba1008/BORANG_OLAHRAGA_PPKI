<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Sijil AI</title>
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca; --secondary: #10b981; --secondary-hover: #059669;
            --warning: #f59e0b; --warning-hover: #d97706; --danger: #ef4444; --danger-hover: #dc2626;
            --bg-color: #f3f4f6; --surface: #ffffff; --text-main: #1f2937; --text-light: #6b7280;
            --border: #e5e7eb; --radius: 12px; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        
        .screen { display: none; width: 100%; max-width: 1200px; padding: 20px; animation: fadeIn 0.3s ease; }
        .active-screen { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 25px; }
        input { width: 100%; padding: 12px 16px; margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; transition: border 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; padding: 12px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: white; width: 100%; }
        button:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-primary { background: var(--primary); } .btn-success { background: var(--secondary); }
        .btn-warning { background: var(--warning); color: #fff; } .btn-danger { background: var(--danger); }
        .btn-ghost { background: transparent; color: var(--primary); box-shadow: none; } .btn-ghost:hover { background: rgba(79, 70, 229, 0.05); }

        #loginScreen .card { max-width: 400px; margin: 10vh auto; text-align: center; }
        .dashboard-container { display: grid; grid-template-columns: 350px 1fr; gap: 20px; align-items: start; }
        @media (max-width: 768px) { .dashboard-container { grid-template-columns: 1fr; } }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 15px 25px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
        .sidebar, .main-panel { background: var(--surface); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
        .add-student-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .add-student-box input { margin: 0; } .add-student-box button { width: auto; padding: 12px 15px; }
        
        .student-list { list-style: none; max-height: 50vh; overflow-y: auto; }
        .student-item { padding: 12px 15px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; display: flex; align-items: center; gap: 10px; }
        .student-item.active { background: rgba(79, 70, 229, 0.1); border-color: var(--primary); font-weight: 600; color: var(--primary); }
        
        .student-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        
        /* Dashboard - Galeri Sijil & Drag Drop UI */
        .cert-list { display: flex; flex-direction: column; gap: 20px; }
        .cert-card { background: var(--bg-color); padding: 15px; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; transition: border 0.3s; }
        .cert-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d1d5db; padding-bottom: 10px; flex-wrap: wrap; gap: 10px;}
        .cert-header h4 { font-size: 16px; margin-bottom: 5px; color: var(--primary); }
        .cert-status { font-size:12px; color:var(--text-light); }
        .cert-status.drive { color: var(--primary); font-weight: 500; }
        .cert-status.unsynced { color: var(--warning); font-weight: bold; animation: pulseText 2s infinite; }
        @keyframes pulseText { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .cert-thumbnails { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; align-items: stretch; }
        
        /* Drag & Drop Styles */
        .thumb-item { position: relative; min-width: 140px; max-width: 140px; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; box-shadow: var(--shadow); flex-shrink: 0; cursor: grab; transition: transform 0.2s; }
        .thumb-item:active { cursor: grabbing; }
        .thumb-item.dragging { opacity: 0.5; transform: scale(0.95); border: 2px dashed var(--primary); }
        .thumb-item.drag-over { border-left: 4px solid var(--primary); transform: translateX(5px); }
        
        .thumb-item img { width: 100%; height: 180px; object-fit: cover; display: block; border-bottom: 1px solid var(--border); cursor: pointer; }
        .thumb-item img:hover { filter: brightness(0.8); }
        .img-overlay-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; text-shadow: 1px 1px 3px black; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
        .thumb-item:hover .img-overlay-text { opacity: 1; }
        
        .thumb-actions { display: flex; flex-direction: column; }
        .thumb-actions button { border-radius: 0; padding: 10px 0; font-size: 12px; }
        
        .thumb-add-btn { min-width: 140px; max-width: 140px; border: 2px dashed var(--primary); border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; color: var(--primary); font-weight: bold; background: rgba(79, 70, 229, 0.05); transition: background 0.2s; }
        .thumb-add-btn:hover { background: rgba(79, 70, 229, 0.15); }
        .thumb-add-btn i { font-size: 30px; margin-bottom: 10px; }

        /* Scanner Screen & Batch Editor */
        #scannerScreen { text-align: center; }
        #scannerScreen .card { max-width: 800px; margin: auto; }
        video, canvas { width: 100%; max-height: 45vh; border-radius: 8px; background: #000; object-fit: contain; margin-bottom: 15px; }
        canvas { display: none; }
        .btn-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;}
        .btn-group button { width: auto; min-width: 140px; }
        #status { font-weight: 600; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: inline-block; width: 100%; }
        
        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; animation: fadeIn 0.2s ease; }
        .modal-box { background: var(--surface); padding: 25px; border-radius: 20px; width: 95%; max-width: 500px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.9); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; max-height: 90vh; overflow-y: auto; }
        @keyframes popIn { to { transform: scale(1); } }
        
        /* Quick Edit Modal Elements */
        #quickEditImg { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; background: #000; }
        
        /* Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- CUSTOM POPUP ALERT -->
    <div id="customAlert" class="modal-overlay">
        <div class="modal-box" style="max-width: 400px;">
            <i id="alertIcon" class="fa-solid fa-circle-info" style="font-size: 50px; margin-bottom: 15px;"></i>
            <div id="alertTitle" style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">Tajuk</div>
            <div id="alertMessage" style="font-size: 14px; color: var(--text-light); margin-bottom: 20px;">Mesej...</div>
            <div id="alertErrorLog" style="background:#fee2e2; color:#991b1b; padding:10px; font-size:11px; margin-bottom:15px; display:none; text-align:left; border-radius:5px; overflow:auto; max-height:100px;"></div>
            <button id="alertBtn" class="btn-primary" style="width: 100%; border-radius: 50px;" onclick="closeAppAlert()">Tutup</button>
        </div>
    </div>

    <!-- QUICK EDIT MODAL (Papar Gambar Besar & Edit) -->
    <div id="quickEditModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-pen-to-square"></i> Edit Sijil</h3>
            <img id="quickEditImg" src="">
            <div id="quickEditStatus" style="font-size: 13px; margin-bottom: 15px; font-weight: bold; color: var(--primary);"></div>
            
            <div class="btn-group">
                <button class="btn-primary" onclick="applyFilterToQuickEdit()"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Filter (B&W)</button>
                <button class="btn-danger" onclick="closeQuickEdit()"><i class="fa-solid fa-check"></i> Selesai Edit</button>
            </div>
        </div>
    </div>

    <!-- SKRIN 1: LOG MASUK -->
    <div id="loginScreen" class="screen">
        <div class="card">
            <i class="fa-solid fa-expand" style="font-size: 40px; color: var(--primary); margin-bottom: 10px;"></i>
            <h3>Sistem Sijil Pro</h3>
            <p style="color: var(--text-light); margin-bottom: 20px; font-size: 14px;">Log masuk untuk mengurus rekod</p>
            <input type="email" id="loginEmail" placeholder="Email Guru (Cth: guru@edu.my)">
            <input type="password" id="loginPassword" placeholder="Kata Laluan">
            <button class="btn-primary" onclick="login()" style="margin-top: 15px;">Log Masuk</button>
            <button class="btn-ghost" onclick="register()">Daftar Akaun Baru</button>
        </div>
    </div>

    <!-- SKRIN 2: DASHBOARD GURU -->
    <div id="dashboardScreen" class="screen">
        <div class="top-bar">
            <h2><i class="fa-solid fa-graduation-cap"></i> Portal Guru</h2>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span id="userEmailDisplay" style="font-size: 14px; font-weight: 500;"></span>
                <button class="btn-ghost" onclick="logout()" style="width: auto; padding: 8px 15px;"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <div class="dashboard-container">
            <div class="sidebar">
                <h3><i class="fa-solid fa-users"></i> Urus Pelajar</h3>
                <div class="add-student-box">
                    <input type="text" id="newStudentName" placeholder="Nama Pelajar Baru...">
                    <button class="btn-primary" onclick="addStudent()" id="btnAddStudent"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul class="student-list" id="studentListUI"></ul>
            </div>

            <div class="main-panel">
                <div id="emptyState" class="empty-state">
                    <i class="fa-solid fa-user-graduate"></i>
                    <h3>Pilih nama pelajar di sebelah kiri</h3>
                </div>
                <div id="studentDetails" style="display: none;">
                    <div class="student-header">
                        <div>
                            <h2 id="activeStudentTitle">Nama Pelajar</h2>
                        </div>
                        <button class="btn-success" onclick="openScanner()">
                            <i class="fa-solid fa-plus"></i> Buka Editor Sijil Baru
                        </button>
                    </div>
                    <h3 style="font-size: 16px; margin-bottom: 15px; color: var(--text-light);">Rekod Sijil (Sesi Ini)</h3>
                    
                    <!-- Senarai Sijil beserta Thumbnail Drag&Drop -->
                    <div class="cert-list" id="certGridUI"></div>
                    
                </div>
            </div>
        </div>
    </div>

    <!-- SKRIN 3: PENGIMBAS & EDITOR PDF POWER (Versi Upload Awal) -->
    <div id="scannerScreen" class="screen">
        <div class="card">
            <div class="scanner-header" style="margin-bottom: 15px;">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Tambah Sijil Baru</h2>
                <p style="color: var(--text-light);">Pelajar: <strong id="scannerStudentLabel"></strong></p>
            </div>
            
            <div id="status">⏳ Menyemak AI...</div>
            <input type="text" id="certName" style="margin-bottom: 15px;" placeholder="Nama Fail (Cth: Sijil_Catur)">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>

            <!-- Galeri Sementara Scanner (Hidden dalam versi Pro ini sebab Dashboard yang handle) -->
            <div class="batch-container hidden">
                <div class="batch-gallery" id="batchGallery"></div>
            </div>

            <div class="btn-group">
                <button id="btnCaptureCam" class="btn-primary"><i class="fa-solid fa-camera"></i> 1. Snap (Kamera)</button>
                <button id="btnUploadFile" class="btn-primary" onclick="document.getElementById('fileUploadInput').click();"><i class="fa-solid fa-folder-open"></i> 1. Pilih Fail / PDF</button>
            </div>
            <div class="btn-group" style="border-top: 1px solid var(--border); padding-top: 15px; margin-top: 5px;">
                <button id="btnPdfBasic" class="btn-success" onclick="generateAndSavePDF()"><i class="fa-solid fa-cloud-arrow-up"></i> 2. Simpan & Upload Drive</button>
                <button class="btn-danger" onclick="closeScanner()"><i class="fa-solid fa-xmark"></i> Batal</button>
            </div>
        </div>
    </div>

    <!-- Hidden Inputs -->
    <input type="file" id="fileUploadInput" accept="image/*,application/pdf" style="display: none;">
    <input type="file" id="inlineAddFileInput" accept="image/*,application/pdf" style="display: none;">

    <!-- Scripts -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOrI7Q-Rpk8xtBe7Ol6TyiWzmSx2Mg5PUpc-YOuMadiKEPXeBzNpBkk79qk-nDrvtB/exec"; 
        
        let currentUserEmail = "";
        let studentsList = []; 
        let activeStudent = "";
        
        // Pangkalan Data Sementara (Lokal State)
        let sessionCerts = []; 
        let currentBatch = []; 
        
        // Pembolehubah Global Untuk Edit & Drag
        let opencvReady = false;
        let dragSourceCertIndex = -1;
        let dragSourcePageIndex = -1;
        let activeEditCertIndex = -1;
        let activeEditPageIndex = -1;
        let targetInlineCertIndex = -1;

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

        // ==========================================
        // SISTEM ALERT
        // ==========================================
        function showAppAlert(title, message, type = "info", rawError = null) {
            const overlay = document.getElementById('customAlert'), icon = document.getElementById('alertIcon'), btn = document.getElementById('alertBtn'), logEl = document.getElementById('alertErrorLog');
            icon.className = 'fa-solid'; btn.style.backgroundColor = "var(--primary)";
            if (type === "error") { icon.classList.add('fa-circle-xmark'); icon.style.color="var(--danger)"; btn.style.backgroundColor = "var(--danger)"; }
            else if (type === "success") { icon.classList.add('fa-circle-check'); icon.style.color="var(--secondary)"; btn.style.backgroundColor = "var(--secondary)"; }
            else if (type === "warning") { icon.classList.add('fa-triangle-exclamation'); icon.style.color="var(--warning)"; btn.style.backgroundColor = "var(--warning)"; }
            else { icon.classList.add('fa-circle-info'); icon.style.color="var(--primary)"; }

            document.getElementById('alertTitle').innerText = title; document.getElementById('alertMessage').innerText = message;
            if (rawError) { logEl.style.display = 'block'; logEl.innerText = "Sistem Log: \n" + rawError; } else logEl.style.display = 'none';
            overlay.style.display = 'flex';
        }
        function closeAppAlert() { document.getElementById('customAlert').style.display = 'none'; }
        function switchScreen(screenId) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(screenId).classList.add('active-screen'); }
        function setStatus(msg, type="info") {
            let el = document.getElementById('status'); el.innerHTML = msg;
            if(type === "info") { el.style.color = "var(--primary)"; el.style.background = "rgba(79,70,229,0.1)"; }
            if(type === "success") { el.style.color = "var(--secondary)"; el.style.background = "rgba(16,185,129,0.1)"; }
            if(type === "warning") { el.style.color = "var(--warning)"; el.style.background = "rgba(245,158,11,0.1)"; }
        }

        // ==========================================
        // AUTO-LOGIN & DATA FETCH
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            const savedUser = localStorage.getItem("sijilProUser");
            if (savedUser) { currentUserEmail = savedUser; document.getElementById('userEmailDisplay').innerText = savedUser; fetchStudents(); switchScreen('dashboardScreen'); } 
            else switchScreen('loginScreen');
        });

        async function login() {
            let email = document.getElementById('loginEmail').value, pass = document.getElementById('loginPassword').value;
            if(!email || !pass) return showAppAlert("Maklumat Tidak Lengkap", "Masukkan email & kata laluan.", "error");
            try {
                let res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "login", email, password: pass }) });
                let data = await res.json();
                if(data.status === "success") {
                    currentUserEmail = email; localStorage.setItem("sijilProUser", email);
                    document.getElementById('userEmailDisplay').innerText = email;
                    fetchStudents(); switchScreen('dashboardScreen');
                } else showAppAlert("Gagal Log Masuk", data.message, "error");
            } catch (err) { showAppAlert("Ralat", "Gagal menghubungi pelayan.", "error", err.toString()); }
        }
        function logout() { localStorage.removeItem("sijilProUser"); sessionCerts=[]; switchScreen('loginScreen'); }

        async function fetchStudents() {
            try {
                let res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "getStudents" }) });
                let data = await res.json();
                if (data.status === "success") { studentsList = data.data; renderStudentList(); }
            } catch (err) { console.log("Gagal sync DB"); }
        }
        async function addStudent() {
            let input = document.getElementById('newStudentName'), name = input.value.trim();
            if(!name) return; if(studentsList.includes(name)) return showAppAlert("Wujud", "Nama sudah ada.", "warning");
            document.getElementById('btnAddStudent').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                let res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "addStudent", studentName: name, guruEmail: currentUserEmail }) });
                let data = await res.json();
                if(data.status === "success") { studentsList.push(name); studentsList.sort(); input.value = ""; renderStudentList(); selectStudent(name); } 
            } catch (err) { showAppAlert("Ralat", "Proses terhenti.", "error", err.toString()); } 
            finally { document.getElementById('btnAddStudent').innerHTML = '<i class="fa-solid fa-plus"></i>'; }
        }

        // ==========================================
        // DASHBOARD RENDERER (DENGAN DRAG & DROP UI)
        // ==========================================
        function renderStudentList() {
            const ul = document.getElementById('studentListUI'); ul.innerHTML = "";
            studentsList.forEach(name => {
                let li = document.createElement('li'); li.className = `student-item ${name === activeStudent ? 'active' : ''}`;
                li.innerHTML = `<i class="fa-solid fa-user"></i> ${name}`; li.onclick = () => selectStudent(name); ul.appendChild(li);
            });
        }
        
        function selectStudent(name) {
            activeStudent = name; renderStudentList(); 
            document.getElementById('emptyState').style.display='none'; document.getElementById('studentDetails').style.display='block';
            document.getElementById('activeStudentTitle').innerText = name; renderCerts();
        }

        function renderCerts() {
            const listUI = document.getElementById('certGridUI'); listUI.innerHTML = "";
            let myCerts = sessionCerts.filter(c => c.student === activeStudent);
            if(myCerts.length === 0) { listUI.innerHTML = `<p style="font-size:14px; color:grey;">Belum ada sijil diproses.</p>`; return; }

            sessionCerts.forEach((cert, certIndex) => {
                if (cert.student !== activeStudent || cert.images.length === 0) return;

                let thumbsHTML = "";
                cert.images.forEach((imgData, imgIndex) => {
                    // Elemen boleh ditarik (Draggable)
                    thumbsHTML += `
                        <div class="thumb-item" draggable="true" 
                             ondragstart="dragStart(event, ${certIndex}, ${imgIndex})" 
                             ondragover="dragOver(event)" 
                             ondragleave="dragLeave(event)"
                             ondrop="drop(event, ${certIndex}, ${imgIndex})">
                             
                            <img src="${imgData}" onclick="openQuickEdit(${certIndex}, ${imgIndex})">
                            <span class="img-overlay-text">✏️ Klik Edit</span>
                            
                            <div class="thumb-actions">
                                <button class="btn-danger" onclick="deleteLocalThumbnail(${certIndex}, ${imgIndex})" style="background: var(--danger);"><i class="fa-solid fa-trash"></i> Buang</button>
                            </div>
                        </div>
                    `;
                });

                // Butang Tambah Page pada hujung senarai
                thumbsHTML += `
                    <div class="thumb-add-btn" onclick="triggerInlineAdd(${certIndex})">
                        <i class="fa-solid fa-file-circle-plus"></i> Tambah Page
                    </div>
                `;

                let statusLabel = cert.needsSync 
                    ? `<span class="cert-status unsynced"><i class="fa-solid fa-triangle-exclamation"></i> Ada perubahan! Belum dikemas kini ke Cloud.</span>` 
                    : `<span class="cert-status drive"><i class="fa-solid fa-cloud-check"></i> Tersimpan selari di Drive & Lokal</span>`;

                let syncBtnHtml = cert.needsSync
                    ? `<button class="btn-warning" onclick="syncUpdateToCloud(${certIndex})" style="width:auto; padding: 10px; animation: pulseText 2s infinite;"><i class="fa-solid fa-cloud-arrow-up"></i> Kemaskini Cloud (PDF)</button>`
                    : `<button class="btn-primary" onclick="downloadLocalPDF(${certIndex})" style="width:auto; padding: 10px;"><i class="fa-solid fa-download"></i> Download Semua PDF</button>`;

                listUI.innerHTML += `
                    <div class="cert-card" style="${cert.needsSync ? 'border-color: var(--warning);' : ''}">
                        <div class="cert-header">
                            <div>
                                <h4>${cert.certName}</h4>
                                ${statusLabel}
                            </div>
                            <div style="display:flex; gap:10px;">
                                ${syncBtnHtml}
                            </div>
                        </div>
                        <div class="cert-thumbnails" ondragover="dragOver(event)" ondrop="dropAtEnd(event, ${certIndex})">
                            ${thumbsHTML}
                        </div>
                    </div>
                `;
            });
        }

        // ==========================================
        // FUNGSI DRAG & DROP (SUSUN ATUR GAMBAR)
        // ==========================================
        function dragStart(e, certIdx, pageIdx) {
            dragSourceCertIndex = certIdx;
            dragSourcePageIndex = pageIdx;
            e.dataTransfer.effectAllowed = 'move';
            e.target.classList.add('dragging');
        }
        function dragOver(e) {
            e.preventDefault(); 
            e.dataTransfer.dropEffect = 'move';
            if(e.currentTarget.classList.contains('thumb-item')) e.currentTarget.classList.add('drag-over');
        }
        function dragLeave(e) {
            if(e.currentTarget.classList.contains('thumb-item')) e.currentTarget.classList.remove('drag-over');
        }
        function drop(e, targetCertIdx, targetPageIdx) {
            e.preventDefault(); e.stopPropagation();
            if(e.currentTarget.classList.contains('thumb-item')) e.currentTarget.classList.remove('drag-over');
            
            // Halang jika tarik ke album (cert) yang berbeza
            if (dragSourceCertIndex !== targetCertIdx) return showAppAlert("Dilarang", "Sila susun di dalam kumpulan sijil yang sama sahaja.", "warning");
            // Halang jika kedudukan sama
            if (dragSourcePageIndex === targetPageIdx) return;
            
            let cert = sessionCerts[targetCertIdx];
            let itemMoved = cert.images.splice(dragSourcePageIndex, 1)[0];
            cert.images.splice(targetPageIdx, 0, itemMoved); // Masukkan di kedudukan baru
            
            cert.needsSync = true; // Flag untuk Cloud Update
            renderCerts(); // Render semula UI
        }
        function dropAtEnd(e, targetCertIdx) {
            e.preventDefault();
            if (dragSourceCertIndex !== targetCertIdx || dragSourcePageIndex === sessionCerts[targetCertIdx].images.length -1) return;
            let cert = sessionCerts[targetCertIdx];
            let itemMoved = cert.images.splice(dragSourcePageIndex, 1)[0];
            cert.images.push(itemMoved);
            cert.needsSync = true;
            renderCerts();
        }

        // ==========================================
        // FUNGSI INLINE ADD (TAMBAH PAGE BARU DALAM BATCH)
        // ==========================================
        document.getElementById('inlineAddFileInput').addEventListener('change', async (e) => {
            if(targetInlineCertIndex === -1) return;
            const file = e.target.files[0]; if(!file) return;
            let cert = sessionCerts[targetInlineCertIndex];
            
            if(file.type === "application/pdf") {
                try {
                    const arrayBuffer = await file.arrayBuffer(); const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    for(let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i); const viewport = page.getViewport({scale: 1.5}); 
                        canvas.width = viewport.width; canvas.height = viewport.height;
                        await page.render({canvasContext: ctx, viewport: viewport}).promise;
                        cert.images.push(canvas.toDataURL('image/jpeg', 0.9));
                    }
                    cert.needsSync = true; renderCerts();
                } catch(err) { showAppAlert("Ralat PDF", "Gagal ektrak PDF.", "error"); }
            } else {
                const img = new Image();
                img.onload = function() {
                    canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0);
                    // Boleh tambah AI Crop inline di sini, tapi untuk laju kita terus terima imej penuh
                    cert.images.push(canvas.toDataURL('image/jpeg', 0.9));
                    cert.needsSync = true; renderCerts();
                }
                img.src = URL.createObjectURL(file);
            }
            e.target.value = "";
        });
        function triggerInlineAdd(certIdx) { targetInlineCertIndex = certIdx; document.getElementById('inlineAddFileInput').click(); }
        function deleteLocalThumbnail(certIdx, pageIdx) {
            if(confirm("Buang muka surat ini?")) { sessionCerts[certIdx].images.splice(pageIdx, 1); sessionCerts[certIdx].needsSync = true; renderCerts(); }
        }

        // ==========================================
        // FUNGSI QUICK EDIT (KLIK UNTUK VIEW & FILTER AI)
        // ==========================================
        function openQuickEdit(cIdx, pIdx) {
            activeEditCertIndex = cIdx; activeEditPageIndex = pIdx;
            let imgData = sessionCerts[cIdx].images[pIdx];
            document.getElementById('quickEditImg').src = imgData;
            document.getElementById('quickEditStatus').innerText = `Muka surat ${pIdx + 1} sedia diedit.`;
            document.getElementById('quickEditModal').style.display = 'flex';
        }
        function closeQuickEdit() { document.getElementById('quickEditModal').style.display = 'none'; }
        
        function applyFilterToQuickEdit() {
            if(!opencvReady) return showAppAlert("AI Belum Sedia", "Tunggu sebentar.", "warning");
            document.getElementById('quickEditStatus').innerText = "⏳ Sedang memproses AI Filter...";
            
            setTimeout(() => {
                let img = document.getElementById('quickEditImg');
                canvas.width = img.naturalWidth; canvas.height = img.naturalHeight; ctx.drawImage(img, 0, 0);
                
                let mat = cv.imread(canvas); cv.cvtColor(mat, mat, cv.COLOR_RGBA2GRAY, 0); cv.adaptiveThreshold(mat, mat, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY, 21, 15);
                cv.imshow(canvas, mat); mat.delete();
                
                let newImgData = canvas.toDataURL('image/jpeg', 0.9);
                img.src = newImgData; // Preview live
                
                // Simpan ke memori
                sessionCerts[activeEditCertIndex].images[activeEditPageIndex] = newImgData;
                sessionCerts[activeEditCertIndex].needsSync = true; // Set flag
                renderCerts(); // Update dashboard belakang tabir
                
                document.getElementById('quickEditStatus').innerText = "✅ Berjaya dibersihkan!";
            }, 100);
        }

        // ==========================================
        // KEMAS KINI KE CLOUD (UPDATE APP SCRIPT)
        // ==========================================
        async function syncUpdateToCloud(certIndex) {
            let cert = sessionCerts[certIndex];
            if(cert.images.length === 0) return showAppAlert("Sijil Kosong", "Tak boleh hantar sijil kosong ke cloud.", "error");
            
            // Tukar butang jadi loading stat (kerana ambil masa sikit)
            let btnList = document.querySelectorAll('.cert-card')[certIndex].querySelectorAll('button');
            btnList.forEach(b => b.disabled = true);
            showAppAlert("Memproses PDF", "Sistem sedang menjana PDF dan menghantar ke Google Drive. Sila tunggu...", "info");
            
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF(); pdf.deletePage(1);

                for(let i = 0; i < cert.images.length; i++) {
                    let imgData = cert.images[i]; let img = new Image(); img.src = imgData;
                    await new Promise(r => img.onload = r);
                    let orientation = img.width > img.height ? 'l' : 'p';
                    pdf.addPage([img.width, img.height], orientation);
                    pdf.addImage(imgData, 'JPEG', 0, 0, img.width, img.height);
                }

                const pdfBase64 = pdf.output('datauristring');
                
                // PANGGIL TINDAKAN "updateFile" yang baru ditambah di Code.gs
                let res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "updateFile", pdfData: pdfBase64, fileName: `${activeStudent} - ${cert.certName}`, studentName: activeStudent, certName: cert.certName, guruEmail: currentUserEmail })
                });
                
                let result = await res.json();
                if (result.status === "success") {
                    cert.needsSync = false; // Padam flag amaran
                    closeAppAlert();
                    showAppAlert("Selesai Sinkronisasi!", "Susunan terkini telah berjaya dikemas kini di Google Drive.", "success");
                    renderCerts(); 
                } else showAppAlert("Gagal", result.message, "error");

            } catch (err) { showAppAlert("Ralat Sistem", "Ralat menyambung ke server.", "error", err.toString()); } 
            finally { btnList.forEach(b => b.disabled = false); }
        }

        async function downloadLocalPDF(certIndex) {
            let cert = sessionCerts[certIndex];
            try {
                const { jsPDF } = window.jspdf; const pdf = new jsPDF(); pdf.deletePage(1);
                for(let i = 0; i < cert.images.length; i++) {
                    let imgData = cert.images[i]; let img = new Image(); img.src = imgData;
                    await new Promise(r => img.onload = r);
                    let orientation = img.width > img.height ? 'l' : 'p';
                    pdf.addPage([img.width, img.height], orientation); pdf.addImage(imgData, 'JPEG', 0, 0, img.width, img.height);
                }
                pdf.save(`${cert.certName}_Compiled.pdf`);
            } catch (err) { showAppAlert("Ralat PDF", "Gagal.", "error"); }
        }

        // ==========================================
        // SISTEM SCANNER ASAL (UNTUK BATCH PERTAMA KALI)
        // ==========================================
        function onOpenCvReady() { opencvReady = true; setStatus("<i class='fa-solid fa-check'></i> AI Bersedia!", "success"); }
        function openScanner() {
            if(!activeStudent) return showAppAlert("Perhatian", "Pilih nama pelajar dari senarai.", "info");
            document.getElementById('scannerStudentLabel').innerText = activeStudent;
            let dateStr = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14); document.getElementById('certName').value = `Sijil_${dateStr}`;
            currentBatch = []; document.getElementById('batchGallery').innerHTML = "";
            switchScreen('scannerScreen'); startCamera();
        }
        function closeScanner() { stopCamera(); switchScreen('dashboardScreen'); }
        function startCamera() { navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => video.srcObject = stream).catch(e => setStatus("Kamera tiada.", "warning")); video.style.display = 'block'; canvas.style.display = 'none'; }
        function stopCamera() { if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop()); }

        document.getElementById('btnCaptureCam').addEventListener('click', () => {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight; ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            setStatus("<i class='fa-solid fa-gear fa-spin'></i> AI Memotong...", "info");
            setTimeout(() => {
                let processedImg = (!opencvReady) ? canvas.toDataURL('image/jpeg', 0.9) : detectAndWarpDocument(canvas);
                currentBatch.push(processedImg); setStatus("<i class='fa-solid fa-check'></i> Ditambah! Boleh tekan butang Simpan.", "success");
            }, 100);
        });

        document.getElementById('fileUploadInput').addEventListener('change', async (e) => {
            const file = e.target.files[0]; if(!file) return;
            if(file.type === "application/pdf") {
                setStatus("<i class='fa-solid fa-spinner fa-spin'></i> AI mengekstrak PDF...", "info");
                try {
                    const arrayBuffer = await file.arrayBuffer(); const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    for(let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i); const viewport = page.getViewport({scale: 1.5}); 
                        canvas.width = viewport.width; canvas.height = viewport.height;
                        await page.render({canvasContext: ctx, viewport: viewport}).promise;
                        currentBatch.push(canvas.toDataURL('image/jpeg', 0.9));
                    }
                    setStatus("<i class='fa-solid fa-check-double'></i> Selesai!", "success");
                } catch(err) { showAppAlert("Ralat PDF", "Gagal ekstrak.", "error"); }
            } else {
                const img = new Image(); img.onload = function() {
                    canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0);
                    let processedImg = (!opencvReady) ? canvas.toDataURL('image/jpeg', 0.9) : detectAndWarpDocument(canvas);
                    currentBatch.push(processedImg); setStatus("<i class='fa-solid fa-check'></i> Gambar ditambah!", "success");
                }
                img.src = URL.createObjectURL(file);
            }
            e.target.value = ""; 
        });

        function detectAndWarpDocument(srcCanvas) {
            try {
                let src = cv.imread(srcCanvas); let dst = new cv.Mat();
                cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY, 0); cv.GaussianBlur(dst, dst, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT); cv.Canny(dst, dst, 75, 200);
                let contours = new cv.MatVector(), hierarchy = new cv.Mat(); cv.findContours(dst, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
                let maxArea = 0, maxContour = null;
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i), area = cv.contourArea(cnt), approx = new cv.Mat(); cv.approxPolyDP(cnt, approx, 0.02 * cv.arcLength(cnt, true), true);
                    if (approx.rows === 4 && area > maxArea && area > 50000) { maxArea = area; if (maxContour) maxContour.delete(); maxContour = approx.clone(); }
                    approx.delete();
                }
                if (maxContour) {
                    let pts = []; for (let j = 0; j < 4; j++) pts.push({ x: maxContour.data32S[j*2], y: maxContour.data32S[j*2+1] });
                    pts.sort((a, b) => a.y - b.y); let top = pts.slice(0, 2).sort((a, b) => a.x - b.x), bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);
                    let orderedPts = [top[0], top[1], bottom[1], bottom[0]];
                    let maxWidth = Math.max(Math.hypot(orderedPts[2].x - orderedPts[3].x, orderedPts[2].y - orderedPts[3].y), Math.hypot(orderedPts[1].x - orderedPts[0].x, orderedPts[1].y - orderedPts[0].y));
                    let maxHeight = Math.max(Math.hypot(orderedPts[1].x - orderedPts[2].x, orderedPts[1].y - orderedPts[2].y), Math.hypot(orderedPts[0].x - orderedPts[3].x, orderedPts[0].y - orderedPts[3].y));
                    let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [orderedPts[0].x, orderedPts[0].y, orderedPts[1].x, orderedPts[1].y, orderedPts[2].x, orderedPts[2].y, orderedPts[3].x, orderedPts[3].y]);
                    let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, maxWidth, 0, maxWidth, maxHeight, 0, maxHeight]);
                    let M = cv.getPerspectiveTransform(srcTri, dstTri); let warped = new cv.Mat();
                    cv.warpPerspective(src, warped, M, new cv.Size(maxWidth, maxHeight), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());
                    cv.imshow(srcCanvas, warped); srcTri.delete(); dstTri.delete(); M.delete(); warped.delete();
                } 
                src.delete(); dst.delete(); contours.delete(); hierarchy.delete(); if (maxContour) maxContour.delete();
                return srcCanvas.toDataURL('image/jpeg', 0.9);
            } catch (err) { return srcCanvas.toDataURL('image/jpeg', 0.9); }
        }

        async function generateAndSavePDF() {
            if(currentBatch.length === 0) return showAppAlert("Koleksi Kosong", "Sila tambah gambar sijil.", "warning");
            let cName = document.getElementById('certName').value.trim();
            if(!cName) { showAppAlert("Nama Fail", "Sila taip nama fail.", "warning"); return; }
            document.getElementById('btnPdfBasic').disabled = true; setStatus("<i class='fa-solid fa-layer-group fa-beat'></i> Menggabungkan & Upload...", "info");
            try {
                const { jsPDF } = window.jspdf; const pdf = new jsPDF(); pdf.deletePage(1);
                for(let i = 0; i < currentBatch.length; i++) {
                    let imgData = currentBatch[i]; let img = new Image(); img.src = imgData; await new Promise(r => img.onload = r);
                    let orientation = img.width > img.height ? 'l' : 'p'; pdf.addPage([img.width, img.height], orientation); pdf.addImage(imgData, 'JPEG', 0, 0, img.width, img.height);
                }
                const pdfBase64 = pdf.output('datauristring');
                let res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "upload", pdfData: pdfBase64, fileName: `${activeStudent} - ${cName}`, studentName: activeStudent, certName: cName, guruEmail: currentUserEmail }) });
                let result = await res.json();
                if (result.status === "success") {
                    sessionCerts.push({ student: activeStudent, certName: cName, images: [...currentBatch], needsSync: false }); // Masuk Dashboard tanpa amaran
                    currentBatch = []; closeScanner(); renderCerts(); 
                } else showAppAlert("Gagal", result.message, "error");
            } catch (err) { showAppAlert("Ralat Sistem", "Ralat dikesan.", "error", err.toString()); } 
            finally { document.getElementById('btnPdfBasic').disabled = false; }
        }
    </script>
