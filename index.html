<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Sijil AI</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; text-align: center; background: #e9ecef; margin: 0; padding: 20px; }
        .screen { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .active-screen { display: block; }
        
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        
        .btn-primary { background: #007bff; }
        .btn-success { background: #28a745; }
        .btn-secondary { background: #6c757d; }
        .btn-danger { background: #dc3545; }
        .btn-warning { background: #ffc107; color: black; }
        
        #scannerScreen { max-width: 900px; }
        video, canvas { max-width: 100%; border: 2px solid #333; border-radius: 8px; margin-bottom: 10px; background-color: #000; }
        canvas { display: none; }
        .btn-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top:10px; }
        .btn-group button { width: auto; }
        #status { margin-bottom: 15px; font-weight: bold; color: #d9534f; padding: 10px; background: #fff; border-radius: 5px; border: 1px solid #ddd; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Sistem Pengurusan Sijil AI</h2>

    <!-- SKRIN 1: LOG MASUK -->
    <div id="loginScreen" class="screen active-screen">
        <h3>Log Masuk Guru / Admin</h3>
        <input type="text" id="loginEmail" placeholder="Email (Cth: guru@sekolah.edu.my)" required>
        <input type="password" id="loginPassword" placeholder="Kata Laluan" required>
        <button onclick="login()">Log Masuk</button>
        <button class="btn-secondary" style="background:none; color:#007bff; box-shadow:none; text-decoration:underline;" onclick="register()">Daftar Akaun Baru</button>
    </div>

    <!-- SKRIN 2: DASHBOARD GURU -->
    <div id="dashboardScreen" class="screen" style="max-width: 700px;">
        <h3>Dashboard Guru</h3>
        <p id="userEmailDisplay"></p>
        <div class="btn-group">
            <button class="btn-success" onclick="switchScreen('scannerScreen'); startCamera();">➕ Scan Sijil Baru</button>
            <button class="btn-warning" onclick="alert('Fungsi muat turun batch di Google Drive.')">📚 Muat Turun Semua (PDF)</button>
        </div>
        
        <h4 style="text-align:left; margin-top:30px;">Senarai Sijil Terkini</h4>
        <table>
            <thead><tr><th>Nama Pelajar</th><th>Nama Sijil</th><th>Tindakan</th></tr></thead>
            <tbody id="certTableBody">
                <tr><td>Ahmad Ali</td><td>Sijil Kokurikulum 2026</td><td><button class="btn-secondary" style="padding:5px;">Lihat PDF (Simulasi)</button></td></tr>
            </tbody>
        </table>
        <button class="btn-danger" style="margin-top: 20px;" onclick="logout()">Log Keluar</button>
    </div>

    <!-- SKRIN 3: PENGIMBAS -->
    <div id="scannerScreen" class="screen">
        <div id="status">⏳ Sedang memuat AI... Sila tunggu.</div>
        
        <input type="text" id="studentName" placeholder="Masukkan Nama Pelajar (Cth: Ahmad Ali)">
        <input type="text" id="certName" placeholder="Nama Sijil (Cth: Sijil Penyertaan Catur)">

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <div class="btn-group">
            <button id="btnCapture" disabled>📸 Imbas & Ratakan</button>
            <button id="btnFilter" class="btn-success" style="display:none;">✨ Buang Bayang (B&W)</button>
            
            <!-- Pilihan PDF -->
            <button id="btnPdfBasic" class="btn-primary" style="display:none;" onclick="generateAndSavePDF(false)">📄 Simpan PDF Biasa</button>
            <button id="btnPdfOcr" class="btn-warning" style="display:none;" onclick="generateAndSavePDF(true)">📝 Simpan PDF + Teks (OCR)</button>
            
            <button id="btnRetake" class="btn-secondary" style="display:none;" onclick="resetScanner()">🔄 Batal</button>
        </div>
    </div>

    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // ==========================================
        // TETAPAN GOOGLE APPS SCRIPT
        // ==========================================
        // SILA MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwngY_n_gaHAY-fAe3H4zR6HY6VTdoJh4ChLooiM6PtwVE8lh_fz-VFoAHFhzEVT0Zn/exec"; 
        
        let currentUserEmail = "";

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
        }

        async function login() {
            let email = document.getElementById('loginEmail').value;
            let pass = document.getElementById('loginPassword').value;
            
            if(!email || !pass) return alert("Sila masukkan maklumat lengkap.");
            
            // Bypass simulasi sementara untuk uji fungsi UI sebelum Web App dimasukkan
            if(WEB_APP_URL === "MASUKKAN_URL_WEB_APP_ANDA_DI_SINI") {
                currentUserEmail = email;
                document.getElementById('userEmailDisplay').innerText = "Log masuk sebagai: " + email;
                switchScreen('dashboardScreen');
                return;
            }

            try {
                let res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "login", email: email, password: pass })
                });
                let data = await res.json();
                
                if(data.status === "success") {
                    currentUserEmail = email;
                    document.getElementById('userEmailDisplay').innerText = "Log masuk sebagai: " + email;
                    switchScreen('dashboardScreen');
                } else {
                    alert(data.message);
                }
            } catch (err) { alert("Ralat sistem sambungan."); }
        }

        async function register() {
            let email = document.getElementById('loginEmail').value;
            let pass = document.getElementById('loginPassword').value;
            
            if(!email || !pass) return alert("Sila masukkan maklumat pada ruangan log masuk untuk didaftarkan.");
            
            if(WEB_APP_URL === "MASUKKAN_URL_WEB_APP_ANDA_DI_SINI") return alert("Simulasi: Pendaftaran direkodkan.");

            try {
                let res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "register", email: email, password: pass })
                });
                let data = await res.json();
                alert(data.message);
            } catch (err) { alert("Ralat sambungan."); }
        }

        function logout() {
            currentUserEmail = "";
            stopCamera();
            switchScreen('loginScreen');
        }

        // ==========================================
        // OPENCV: KAMERA & AI PENGESAN BUCU
        // ==========================================
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const btnCapture = document.getElementById('btnCapture');
        const btnFilter = document.getElementById('btnFilter');
        const btnPdfBasic = document.getElementById('btnPdfBasic');
        const btnPdfOcr = document.getElementById('btnPdfOcr');
        const btnRetake = document.getElementById('btnRetake');
        const statusText = document.getElementById('status');
        let opencvReady = false;
        let localStream = null;

        function onOpenCvReady() {
            opencvReady = true;
            statusText.innerText = "✅ AI Bersedia! Halakan kamera pada sijil.";
            statusText.style.color = "#28a745";
            btnCapture.disabled = false;
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } })
                .then(stream => { localStream = stream; video.srcObject = stream; })
                .catch(err => { alert("Gagal akses kamera."); });
        }

        function stopCamera() {
            if(localStream) localStream.getTracks().forEach(track => track.stop());
        }

        function resetScanner() {
            video.style.display = 'block'; canvas.style.display = 'none';
            btnCapture.style.display = 'inline-block'; btnFilter.style.display = 'none';
            btnPdfBasic.style.display = 'none'; btnPdfOcr.style.display = 'none'; btnRetake.style.display = 'none';
            statusText.innerText = "✅ AI Bersedia! Halakan kamera pada sijil."; statusText.style.color = "#28a745";
        }

        // TANGKAP DAN WARP PERSPEKTIF
        btnCapture.addEventListener('click', () => {
            if (!opencvReady) return;
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            video.style.display = 'none'; canvas.style.display = 'block';
            btnCapture.style.display = 'none'; btnRetake.style.display = 'inline-block';
            statusText.innerText = "🔄 Mengira sudut 3D...";
            setTimeout(detectAndWarpDocument, 100); 
        });

        function detectAndWarpDocument() {
            try {
                let src = cv.imread('canvas'); let dst = new cv.Mat();
                cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY, 0);
                cv.GaussianBlur(dst, dst, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                cv.Canny(dst, dst, 75, 200);
                
                let contours = new cv.MatVector(), hierarchy = new cv.Mat();
                cv.findContours(dst, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
                
                let maxArea = 0, maxContour = null;
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i), area = cv.contourArea(cnt);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * cv.arcLength(cnt, true), true);
                    if (approx.rows === 4 && area > maxArea && area > 50000) { 
                        maxArea = area; if (maxContour) maxContour.delete(); maxContour = approx.clone();
                    }
                    approx.delete();
                }
                
                if (maxContour) {
                    let pts = [];
                    for (let j = 0; j < 4; j++) pts.push({ x: maxContour.data32S[j * 2], y: maxContour.data32S[j * 2 + 1] });
                    pts.sort((a, b) => a.y - b.y); 
                    let top = pts.slice(0, 2).sort((a, b) => a.x - b.x); 
                    let bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);
                    let orderedPts = [top[0], top[1], bottom[1], bottom[0]];
                    
                    let maxWidth = Math.max(Math.hypot(orderedPts[2].x - orderedPts[3].x, orderedPts[2].y - orderedPts[3].y), Math.hypot(orderedPts[1].x - orderedPts[0].x, orderedPts[1].y - orderedPts[0].y));
                    let maxHeight = Math.max(Math.hypot(orderedPts[1].x - orderedPts[2].x, orderedPts[1].y - orderedPts[2].y), Math.hypot(orderedPts[0].x - orderedPts[3].x, orderedPts[0].y - orderedPts[3].y));

                    let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [orderedPts[0].x, orderedPts[0].y, orderedPts[1].x, orderedPts[1].y, orderedPts[2].x, orderedPts[2].y, orderedPts[3].x, orderedPts[3].y]);
                    let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, maxWidth, 0, maxWidth, maxHeight, 0, maxHeight]);

                    let M = cv.getPerspectiveTransform(srcTri, dstTri);
                    let warped = new cv.Mat();
                    cv.warpPerspective(src, warped, M, new cv.Size(maxWidth, maxHeight), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());
                    
                    canvas.width = maxWidth; canvas.height = maxHeight;
                    cv.imshow('canvas', warped);
                    statusText.innerText = "✨ Sijil diratakan! Tekan 'Buang Bayang'.";
                    btnFilter.style.display = 'inline-block';
                    
                    srcTri.delete(); dstTri.delete(); M.delete(); warped.delete();
                } else {
                    cv.imshow('canvas', src);
                    statusText.innerText = "⚠️ Gagal kesan bucu automatik.";
                    btnFilter.style.display = 'inline-block';
                }
                src.delete(); dst.delete(); contours.delete(); hierarchy.delete();
                if (maxContour) maxContour.delete();
            } catch (err) { console.error(err); }
        }

        // BUANG BAYANG (ADAPTIVE THRESHOLD)
        btnFilter.addEventListener('click', () => {
            let src = cv.imread('canvas'); let dst = new cv.Mat();
            cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY, 0);
            cv.adaptiveThreshold(dst, dst, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY, 21, 15);
            cv.imshow('canvas', dst);
            src.delete(); dst.delete();
            
            btnFilter.style.display = 'none';
            btnPdfBasic.style.display = 'inline-block';
            btnPdfOcr.style.display = 'inline-block';
            
            statusText.innerText = "✅ Selesai! Pilih mod PDF untuk dijanakan.";
        });

        // ==========================================
        // JANA PDF (Biasa / OCR) & HANTAR KE GOOGLE DRIVE
        // ==========================================
        async function generateAndSavePDF(useOCR) {
            let sName = document.getElementById('studentName').value || "Pelajar_Tiada_Nama";
            let cName = document.getElementById('certName').value || "Sijil_Umum";
            let fileName = `${sName} - ${cName}`;
            
            btnPdfBasic.disabled = true; btnPdfOcr.disabled = true; btnRetake.disabled = true;

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [canvas.width, canvas.height]
                });

                const imgData = canvas.toDataURL('image/jpeg', 0.9); // Compress sikit supaya ringan (0.9)
                pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);

                if (useOCR) {
                    statusText.innerText = "⏳ AI OCR membaca teks (Ini mengambil sedikit masa)...";
                    statusText.style.color = "#ffc107";
                    const { data: { text } } = await Tesseract.recognize(canvas, 'eng+msa'); 
                    pdf.addPage();
                    pdf.setFontSize(12);
                    pdf.text("Teks yang diekstrak: \n\n" + text, 20, 30);
                }

                statusText.innerText = "⏳ Sedang memuat naik PDF ke Google Drive...";
                
                // Tukarkan file PDF kepada bentuk Base64 Data String
                const pdfBase64 = pdf.output('datauristring');

                // Jika tiada URL Web App dimasukkan, muat turun ke dalam telefon/komputer secara offline
                if(WEB_APP_URL === "MASUKKAN_URL_WEB_APP_ANDA_DI_SINI") {
                    pdf.save(fileName + ".pdf");
                    alert("Sijil dimuat turun ke peranti anda (Simulasi Offline). Masukkan URL Web App untuk upload ke Drive.");
                    resetScanner();
                    switchScreen('dashboardScreen');
                    return;
                }

                // Hantar Payload ke Google Apps Script (Code.gs)
                let payload = {
                    action: "upload",
                    pdfData: pdfBase64,
                    fileName: fileName,
                    studentName: sName,
                    certName: cName,
                    guruEmail: currentUserEmail
                };

                let res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                let result = await res.json();
                
                if (result.status === "success") {
                    statusText.innerText = "✅ Sijil berjaya dimuat naik ke Drive dan direkodkan!";
                    statusText.style.color = "#28a745";
                    alert("Berjaya disimpan dalam Google Drive/Sheets!");
                    resetScanner();
                    switchScreen('dashboardScreen');
                } else {
                    alert("Gagal muat naik: " + result.message);
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "❌ Ralat semasa pemprosesan PDF atau Muat Naik.";
            } finally {
                btnPdfBasic.disabled = false; btnPdfOcr.disabled = false; btnRetake.disabled = false;
            }
        }
    </script>
</body>
</html>
